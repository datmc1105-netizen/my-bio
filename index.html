<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    .social-icons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
    }

    .icon-btn {
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: white;
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    .icon-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.4);
    }
</style>
</head>
<body>
    <div class="card">
        <div class="avatar-container">
        <img src="https://cdn.discordapp.com/attachments/1484879717315252324/1500117461498990665/anh-tokito-muichiro-09.png?ex=69f744c1&is=69f5f341&hm=0abce22a6f26b09a9c5c33007a142082394e2717d541a0194bdb023d1f9e7da9&/%3E">
        </div>
        <h1>Đạt</h1>
        <p> Đang làm lại từ đầu ae có gì ủng hộ tui bên facebook nhé ! </p>
        <div class="button-group">
         <!-- Dán đoạn này vào chỗ ông muốn hiển thị nút -->
<div class="social-icons">
    <a href="https://www.facebook.com/profile.php?id=61567735786967" class="icon-btn">
        <i class="fa-brands fa-facebook"></i>
    </a>
    <!-- Ông có thể thêm các nút khác tương tự ở đây -->
    <!-- Đoạn code trình phát nhạc -->
<audio id="bg-music" loop autoplay muted>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<!-- Nút bấm bật/tắt nhạc -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <button onclick="toggleMusic()" id="music-btn" style="background: rgba(0, 200, 255, 0.6); border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; width: 50px; height: 50px; font-size: 20px; box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);">
        🎵
    </button>
</div>
    <script>
   function toggleMusic() {
    var music = document.getElementById("bg-music");
    var btn = document.getElementById("music-btn");

    if (music.paused) {
        music.muted = false; // Quan trọng nhất là dòng này để gỡ lệnh chặn của trình duyệt
        music.play().catch(function(error) {
            console.log("Trình duyệt vẫn chặn: ", error);
        });
        btn.innerHTML = "🎵"; // Đổi icon khi đang phát
    } else {
        music.pause();
        btn.innerHTML = "🔇"; // Đổi icon khi tắt
    }
}
</script>
</body>
</html>

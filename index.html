<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đạt | The Shadow Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="avatar-container">
        <img src="https://cdn.discordapp.com/attachments/1484879717315252324/1500117461498990665/anh-tokito-muichiro-09.png?ex=69f744c1&is=69f5f341&hm=0abce22a6f26b09a9c5c33007a142082394e2717d541a0194bdb023d1f9e7da9&/%3E">
        </div>
        <h1>Đạt</h1>
        <p>Owner The Shadow Market</p>
        <div class="button-group">
            <a href="https://discord.gg/7EZ65uyx7" class="btn">🏠 Server Discord</a>
            <a href="#" class="btn">🛒 Shop Blox Fruit</a>
        </div>
    </div>
    <!-- Đoạn code trình phát nhạc -->
<audio id="bg-music" loop autoplay muted>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Nút bấm bật/tắt nhạc -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <button onclick="toggleMusic()" id="music-btn" style="background: rgba(0, 200, 255, 0.6); border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; width: 50px; height: 50px; font-size: 20px; box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);">
        🎵
    </button>
</div>

<script>
    var music = document.getElementById("bg-music");
var btn = document.getElementById("music-btn");

function toggleMusic() {
    if (music.paused) {
        music.play().then(() => {
            btn.innerHTML = "⏸️"; // Đổi icon sang Pause
            btn.style.background = "rgba(255, 0, 0, 0.6)"; // Đổi màu sang đỏ
        }).catch(error => {
            console.log("Lỗi phát nhạc:", error);
            alert("Đạt ơi, hãy nhấn vào màn hình một cái rồi bấm lại nút nhạc nhé!");
        });
    } else {
        music.pause();
        btn.innerHTML = "🎵"; // Đổi lại icon nốt nhạc
        btn.style.background = "rgba(0, 200, 255, 0.6)"; // Đổi lại màu xanh
    }
}
</html>

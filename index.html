<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    body {
        background: url('https://i.pinimg.com/originals/dc/f3/7a/dcf37a91bd27c05db5cfa4906176513d.gif') no-repeat center center fixed; /* Lấy ảnh Muichiro của ông làm nền */
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
        background: rgba(255, 255, 255, 0.05); /* Độ mờ cực mỏng */
        backdrop-filter: blur(15px); /* Hiệu ứng kính mờ xịn */
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        padding: 40px;
        text-align: center;
        width: 380px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .avatar-container img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 3px solid #00c3ff; /* Màu xanh Muichiro */
        box-shadow: 0 0 15px #00c3ff;
        margin-bottom: 20px;
    }

    h1 { color: #fff; margin: 10px 0; font-size: 28px; }
    p { color: rgba(255, 255, 255, 0.8); font-size: 15px; line-height: 1.5; }

    .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 25px;
    }

    .icon-btn {
        width: 55px;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        color: #fff;
        font-size: 24px;
        text-decoration: none;
        transition: 0.4s;
    }

    .icon-btn:hover {
        background: #00c3ff;
        transform: translateY(-8px);
        box-shadow: 0 0 20px #00c3ff;
        border-color: #00c3ff;
    }
</style>
</head><body>
    <div class="card">
        <div class="avatar-container">
            <!-- Ảnh Muichiro của ông -->
            <img src="https://tinycollege.edu.vn/upload/2025/03/tokito-muichiro-ngau-1.webp">
        </div>
        
        <h1>Đạt</h1>
        <p>Đang làm lại từ đầu ae có gì ủng hộ tui bên facebook nhé !</p>
        
        <!-- Gộp hết nút bấm vào đây, xóa cái button-group thừa đi -->
        <div class="social-icons">
            <a href="https://www.facebook.com/profile.php?id=61567735786967" class="icon-btn">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- Ông có thể thêm nút Discord hay TikTok ở đây nếu muốn -->
        </div>
    </div> <!-- Đây là thẻ đóng quan trọng để bọc mọi thứ vào trong khung card -->
    <!-- Đoạn code trình phát nhạc -->
<audio id="bg-music" loop autoplay muted>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<!-- Nút bấm bật/tắt nhạc -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <button onclick="toggleMusic()" id="music-btn" style="background: rgba(0, 200, 255, 0.6); border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; width: 50px; height: 50px; font-size: 20px; box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);">
        🎵
    </button>
</div>
    <script>
   function toggleMusic() {
    var music = document.getElementById("bg-music");
    var btn = document.getElementById("music-btn");

    if (music.paused) {
        music.muted = false; // Quan trọng nhất là dòng này để gỡ lệnh chặn của trình duyệt
        music.play().catch(function(error) {
            console.log("Trình duyệt vẫn chặn: ", error);
        });
        btn.innerHTML = "🎵"; // Đổi icon khi đang phát
    } else {
        music.pause();
        btn.innerHTML = "🔇"; // Đổi icon khi tắt
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đạt | The Shadow Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="avatar-container">
        <img src="https://i.pinimg.com/originals/9c/1f/d7/9c1fd708b64eb696c23dbc177c77e74d.gif">
        </div>
        <h1>Đạt</h1>
        <p>Owner The Shadow Market</p>
        <div class="button-group">
            <a href="https://discord.gg/7EZ65uyx7" class="btn">🏠 Server Discord</a>
            <a href="#" class="btn">🛒 Shop Blox Fruit</a>
        </div>
    </div>
    <!-- Đoạn code trình phát nhạc -->
<audio id="bg-music" loop>
    <source src="https://raw.githubusercontent.com/Tiendatmagician/music-box/main/ai-dua-em-ve.mp3" type="audio/mpeg">
</audio>

<!-- Nút bấm bật/tắt nhạc -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <button onclick="toggleMusic()" id="music-btn" style="background: rgba(0, 200, 255, 0.6); border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; width: 50px; height: 50px; font-size: 20px; box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);">
        🎵
    </button>
</div>

<script>
    var music = document.getElementById("bg-music");
    var btn = document.getElementById("music-btn");

    function toggleMusic() {
        if (music.paused) {
            music.play();
            btn.innerHTML = "⏸️";
            btn.style.background = "rgba(255, 0, 0, 0.6)"; // Đổi sang màu đỏ khi đang phát
        } else {
            music.pause();
            btn.innerHTML = "🎵";
            btn.style.background = "rgba(0, 200, 255, 0.6)"; // Trở lại màu xanh
        }
    }
</script>
</body>
</html>

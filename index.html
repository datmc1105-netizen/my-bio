<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đạt | The Shadow Market</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://cdn.discordapp.com/attachments/1484879717315252324/1500117461498990665/anh-tokito-muichiro-09.png?ex=69f744c1&is=69f5f341&hm=0abce22a6f26b09a9c5c33007a142082394e2717d541a0194bdb023d1f9e7da9&') no-repeat center center/cover;
            font-family: sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: white;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: rgba(0, 212, 255, 0.5); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn.discordapp.com/attachments/1484879717315252324/1500117461498990665/anh-tokito-muichiro-09.png?ex=69f744c1&is=69f5f341&hm=0abce22a6f26b09a9c5c33007a142082394e2717d541a0194bdb023d1f9e7da9&" class="profile-pic">
        <h1>Đạt</h1>
        <p>Owner The Shadow Market</p>
        <a href="#" class="btn">🏠 Server Discord</a>
        <a href="#" class="btn">🛒 Shop Blox Fruit</a>
    </div>
</body>
</html>

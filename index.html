<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đạt | The Shadow Market</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Tui đã thay link ảnh nền bền hơn cho ông */
            background: url('https://i.imgur.com/3YhI3oV.jpg') no-repeat center center/cover;
            font-family: sans-serif;
        }
        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: white;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .btn {
            display: block;
            background: rgba(0, 212, 255, 0.3);
            color: white;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover { background: rgba(0, 212, 255, 0.6); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://i.imgur.com/3YhI3oV.jpg" class="profile-pic">
        <h1>Đạt</h1>
        <p>Owner The Shadow Market</p>
        <a href="https://discord.gg/boladatgg" class="btn">🏠 Server Discord</a>
        <a href="#" class="btn">🛒 Shop Blox Fruit</a>
    </div>
</body>
</html>
